<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8xCGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" type="image/x-icon" href="./img/hbd.png">
  <title>Happy Birthday!</title>
</head>

<body>
  <audio id="background-music" src="./music/Background_musik.mp3" preload="auto" loop>
  </audio>

  <div class="bg" id="content">

    <div id="intro" class="intro">
      <img class="intro-gif" src="./img/gif/Intro_halo.gif" alt="Halo">
      <h1 class="intro-teks">Allo cantikk <span class="lambai">👋</span></h1>
      <button id="mulai" class="btn-mulai" type="button">hallo juga ganteng</button>
    </div>

    <div id="slideSatu" class="d-none">
      <img src="./img/hbd1.png" class="img">
    </div>

    <div id="slideDua"
      class="slides d-none paper">
      <div class="paper-content">
        <p id="teks1" class="teks"></p>
      </div>
      <img class="typing-gif" src="./img/gif/Animasi_Type.gif" alt="">
    </div>

    <div id="slideTiga" class="slides d-none paper">
      <div class="paper-content">
        <p id="teks2" class="teks"></p>
      </div>
      <img class="typing-gif" src="./img/gif/Animasi_Type.gif" alt="">
    </div>

    <div class="kotak d-none slides" id="slideEmpat">
      <img id="gif-gak" class="gif-gak d-none" src="./img/gif/Animasi%20_yes_or_no.gif" alt="">
      <div class="row">
        <div class="col-sm mt-1">
          <h5>Kamu sayang enggak?</h5>
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-4 offset-2">
          <button id="gak" class="btn btn-outline-danger"> Gak! </button>
        </div>
        <div class="col-4">
          <button id="suka" class="btn btn-outline-info">iyaa sayang</button>
        </div>
      </div>
    </div>

    <div id="slideLima" class="d-none">
      <img class="gif-akhir" src="./img/gif/Happy_Birthday_Cat_GIF.gif.gif" alt="Happy Birthday">
    </div>
    <p id="trims" class="text-muted d-none mt-2"></p>

    <div id="slideEnam" class="d-none">
      <section class="scrapbook" aria-label="Galeri momen">
        <span class="scrapbook-tape" aria-hidden="true"></span>

        <svg class="doodle doodle-heart" viewBox="0 0 120 120" aria-hidden="true">
          <path d="M60 98C45 82 20 67 20 45c0-13 10-23 23-23 8 0 14 4 17 11 3-7 9-11 17-11 13 0 23 10 23 23 0 22-25 37-40 53Z" />
        </svg>
        <svg class="doodle doodle-star" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 7l11 30 32 1-26 19 9 31-26-18-26 18 9-31-26-19 32-1Z" />
        </svg>

        <h5 class="galeri-judul">Beberapa momen kita yang aku simpan.</h5>
        <svg class="coretan" viewBox="0 0 220 14" aria-hidden="true">
          <path d="M3 9c18-8 35 2 52-1s34-7 51 0 34 5 52-2 35 1 59-2" />
        </svg>
        <p class="galeri-sub">aku tempel rapi di sini, hehe.</p>

        <div class="gallery kolase">
          <figure class="momen rot-1 landscape">
            <div class="kartu">
              <span class="tape" aria-hidden="true"></span>
              <div class="foto"><img src="./img/momen1.jpg" alt="Momen kita 1"></div>
              <span class="stiker" aria-hidden="true"></span>
            </div>
            <figcaption>momen kita</figcaption>
          </figure>

          <figure class="momen rot-2 landscape">
            <div class="kartu">
              <span class="tape" aria-hidden="true"></span>
              <div class="foto"><img src="./img/momen2.jpg" alt="Momen kita 2"></div>
              <span class="stiker" aria-hidden="true"></span>
            </div>
            <figcaption>hehe, gemas</figcaption>
          </figure>

          <figure class="momen rot-3 landscape">
            <div class="kartu">
              <span class="tape" aria-hidden="true"></span>
              <div class="foto"><img src="./img/momen3.jpg" alt="Momen kita 3"></div>
              <span class="stiker" aria-hidden="true"></span>
            </div>
            <figcaption>favorit</figcaption>
          </figure>

          <figure class="momen rot-4 portrait">
            <div class="kartu">
              <span class="tape" aria-hidden="true"></span>
              <div class="foto"><img src="./img/momen4.jpg" alt="Momen kita 4"></div>
              <span class="stiker" aria-hidden="true"></span>
            </div>
            <figcaption>manis</figcaption>
          </figure>

          <figure class="momen rot-5 portrait">
            <div class="kartu">
              <span class="tape" aria-hidden="true"></span>
              <div class="foto"><img src="./img/momen5.jpg" alt="Momen kita 5"></div>
              <span class="stiker" aria-hidden="true"></span>
            </div>
            <figcaption>kita terus</figcaption>
          </figure>
        </div>

        <span class="sparkle s1" aria-hidden="true"></span>
        <span class="sparkle s2" aria-hidden="true"></span>
        <span class="sparkle s3" aria-hidden="true"></span>
        <span class="sparkle s4" aria-hidden="true"></span>
        <span class="sparkle s5" aria-hidden="true"></span>
      </section>
    </div>

  </div>

  <footer class="page-footer font-small blue fixed-bottom"></footer>

  <button id="music-toggle" class="music-toggle d-none" type="button" aria-label="Musik" title="Musik">
    <span aria-hidden="true">♪</span>
  </button>

  <!-- Optional JavaScript -->
  <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous">
  </script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous">
  </script>
  <script src="https://kit.fontawesome.com/61e5120832.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/typeit@7.0.4/dist/typeit.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
